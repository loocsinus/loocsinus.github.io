<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Portal &mdash; Creating Smiles Dentistry</title>
    <script src="auth.js"></script>
    <script>PortalAuth.requireAuth();</script>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family: Arial, Helvetica, sans-serif; }
        body { background:#f4f5f7; color:#222; }
        header { background: rgb(126,59,53); color:#fff; padding:0.9rem 1.25rem; display:flex; align-items:center; }
        header h1 { font-size:1.1rem; font-weight:600; flex:1; }
        header a { color:#fff; font-size:0.85rem; }
        main { max-width:760px; margin:0 auto; padding:1.25rem 1rem; }
        h2 { font-size:1rem; color:#555; margin:0.25rem 0 0.9rem; font-weight:600; }
        .grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap:0.9rem; }
        .tool { background:#fff; border-radius:8px; box-shadow:0 1px 4px rgba(0,0,0,0.08); padding:1.1rem 1.2rem; text-decoration:none; color:inherit; display:block; }
        .tool:hover { box-shadow:0 3px 10px rgba(0,0,0,0.14); }
        .tool h3 { font-size:1rem; color: rgb(126,59,53); margin-bottom:0.35rem; }
        .tool p { font-size:0.82rem; color:#666; line-height:1.4; }
        .note { margin-top:1.25rem; font-size:0.82rem; color:#888; }
    </style>
</head>
<body>
    <header>
        <h1>Staff Portal</h1>
        <a href="#" onclick="PortalAuth.logout(); return false;">Log out</a>
    </header>
    <main>
        <h2>Office tools</h2>
        <div class="grid">
            <a class="tool" href="claims.html">
                <h3>Claims tracker</h3>
                <p>Medi-Cal &amp; payer claim ledger &mdash; billed, paid, and outstanding. Encrypted: needs the office passphrase to open.</p>
            </a>
        </div>
        <p class="note">New tools will appear here as they're built &mdash; no need to remember page names.</p>
    </main>
</body>
</html>
